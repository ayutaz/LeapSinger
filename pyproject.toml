[project]
name = "leapsinger"
version = "0.1.0"
description = "Fast singing acoustic model: a sine-harmonic + white-noise excitation mel is refined into a realistic mel by a rectified flow (few reverse steps)."
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = { text = "MIT" }
dependencies = [
    "torch>=2.0",
    "numpy",
    "scipy",
    "librosa",
    "soundfile",
    "pyyaml",
    "pyloudnorm",
    "tqdm",
    "gdown",          # download the example databases (preprocess/download_scripts/)
    "onnxruntime",    # run the bundled NHVSing vocoder ONNX (mel -> waveform)
    "matplotlib",     # training loss/mel figures + the example notebooks
    "transformers>=5.16.1",
]

[project.optional-dependencies]
# ONNX export (export/, `python -m export.cli`). Kept out of the base install so
# training/re-synthesis stays lightweight (onnxruntime is already a base dep).
export = [
    "onnx>=1.14",
    "onnxconverter-common",     # fp32 -> fp16
    "onnxsim",                  # graph simplification (optional; skipped gracefully if it fails)
]

# Training only: the TensorBoard writer used by train.py.
train = [
    "tensorboard",
]
ops = [
    "vastai>=1.5.6",
]

# Notes:
# - F0 extraction uses RMVPE (a neural pitch estimator). See README for the weight download.
# - The vocoder (mel -> waveform) is bundled as an ONNX (checkpoints/nhv_v3.onnx) and run via
#   onnxruntime — self-contained, no external dependency.
# - The duration model and F0 model are published in separate repositories; LeapSinger
#   consumes raw duration + F0 as input.

[tool.setuptools.packages.find]
include = ["leapsinger*"]

# ── uv: PyTorch を CUDA 版で入れる ────────────────────────────────────────
# PyPI の Windows 版 torch は CPU ビルドなので、CUDA を使うには PyTorch 公式の
# wheel index を明示的に指定する必要がある。cu130 (CUDA 13.0) wheel は CUDA 13.x
# 系のドライバ（NVIDIA driver >= 580 相当）で動く。
#   別の CUDA に変えるとき: 下の url の cu130 を cu126 / cu128 / cu132 などに差し替え、
#   `uv lock` をやり直す。channel 一覧は https://download.pytorch.org/whl/ を参照。
# macOS は該当 index に wheel がないので、marker で PyPI (CPU/MPS ビルド) に落とす。
[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cu130", marker = "sys_platform == 'win32' or sys_platform == 'linux'" },
]
