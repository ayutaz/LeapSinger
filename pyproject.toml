[project]
name = "leapsinger"
version = "0.1.0"
description = "Fast singing acoustic model: a sine-harmonic + white-noise excitation mel is refined into a realistic mel by a rectified flow (few reverse steps)."
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = { text = "MIT" }
dependencies = [
    "torch>=2.0",
    "numpy",
    "scipy",
    "librosa",
    "soundfile",
    "pyyaml",
    "pyloudnorm",
    "tqdm",
    "gdown",          # download the example databases (preprocess/download_scripts/)
    "onnxruntime",    # run the bundled NHVSing vocoder ONNX (mel -> waveform)
    "matplotlib",     # training loss/mel figures + the example notebooks
    "transformers>=5.16.1",
]

[project.optional-dependencies]
# ONNX export (export/, `python -m export.cli`). Kept out of the base install so
# training/re-synthesis stays lightweight (onnxruntime is already a base dep).
export = [
    "onnx>=1.14",
    "onnxconverter-common",     # fp32 -> fp16
    "onnxsim",                  # graph simplification (optional; skipped gracefully if it fails)
]

# Training only: the TensorBoard writer used by train.py.
train = [
    "tensorboard",
]
ops = [
    "vastai>=1.5.6",
]
dev = [
    "ruff>=0.16.5",
]
# Speaker-similarity evaluation (tools/speaker_similarity.py, tools/speaker_calibrate.py).
# ECAPA-TDNN is the only encoder that passed our singing calibration: the transformers
# x-vector models cannot separate same-gender singers (overlap 77-83% vs ECAPA's 17-20%).
# Kept out of the base install because it also pulls torchaudio.
eval = [
    "speechbrain>=1.1.1",
]

# Notes:
# - F0 extraction uses RMVPE (a neural pitch estimator). See README for the weight download.
# - The vocoder (mel -> waveform) is bundled as an ONNX (checkpoints/nhv_v3.onnx) and run via
#   onnxruntime — self-contained, no external dependency.
# - The duration model and F0 model are published in separate repositories; LeapSinger
#   consumes raw duration + F0 as input.

[tool.setuptools.packages.find]
include = ["leapsinger*"]

# ── uv: PyTorch を CUDA 版で入れる ────────────────────────────────────────
# PyPI の Windows 版 torch は CPU ビルドなので、CUDA を使うには PyTorch 公式の
# wheel index を明示的に指定する必要がある。cu130 (CUDA 13.0) wheel は CUDA 13.x
# 系のドライバ（NVIDIA driver >= 580 相当）で動く。
#   別の CUDA に変えるとき: 下の url の cu130 を cu126 / cu128 / cu132 などに差し替え、
#   `uv lock` をやり直す。channel 一覧は https://download.pytorch.org/whl/ を参照。
# macOS は該当 index に wheel がないので、marker で PyPI (CPU/MPS ビルド) に落とす。
[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cu130", marker = "sys_platform == 'win32' or sys_platform == 'linux'" },
]

[tool.ruff]
line-length = 100          # 既存コードの実態に合わせた（p99 が 99 字、超過は 0.7%）
target-version = "py313"   # requires-python と揃える
extend-exclude = [".venv", ".smoke", ".m0data", "notebooks", "log", "data", "download"]

[tool.ruff.lint]
# 段階導入。まず「壊れている／間違いやすい」を捕まえる規則から入れる。
# E/W pycodestyle, F pyflakes, I import 順, UP 旧い書き方, B よくある罠
select = ["E", "F", "W", "I", "UP", "B"]

# **既存コードの確立したスタイルと戦う規則は外す。** 動いていてテストのあるコードを
# 見た目のためだけに書き換えるのは、退行リスクだけあって利得が無い。
# 数字は導入時（2026-08-31）の実測。
ignore = [
    "E501",   # line-too-long 145 件。p99 は 99 字で、超過は train.py / export/ など既存 SVS に集中
    "E701",   # if x: return  形式 7 件。このリポジトリの意図的な圧縮スタイル
    "E702",   # a = 1; b = 2  形式 36 件。同上
    "E741",   # 変数名 l  8 件。判別器の l = layer など、文脈上は読める
]

[tool.ruff.lint.per-file-ignores]
# RMVPE の実装は外部由来（重みは lj1995/VoiceConversionWebUI から取得）。
# こちらの規約を後から当てても上流と乖離するだけなので、様式の指摘は外す。
"preprocess/algorithms/rmvpe.py" = ["B007", "B904"]
# `_pad_extra` は同じ反復の中で定義してすぐ呼ぶ閉包で、次の反復に持ち越さない。
# B023 が指す危険（ループ変数の遅延束縛）は起きないことを読んで確認した。
# 既存 SVS の動いているコードを様式のために組み替える利得が無いので除外する。
"preprocess/phrase_cut.py" = ["B023"]
